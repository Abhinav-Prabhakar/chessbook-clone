<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Chessbook local-first architecture</title>
  <desc id="desc">A React PWA talks to a local Express API, which stores the single profile and all training progress in SQLite on the same machine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171b1d"/>
      <stop offset="0.55" stop-color="#111415"/>
      <stop offset="1" stop-color="#0b0d0e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24292b"/>
      <stop offset="1" stop-color="#1b2022"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#80d877"/>
      <stop offset="1" stop-color="#59b6a4"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb000"/>
      <stop offset="1" stop-color="#ff8a00"/>
    </linearGradient>
    <pattern id="checker" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#ffffff"/>
      <rect x="24" y="24" width="24" height="24" fill="#ffffff"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="560" rx="24" fill="url(#checker)" opacity="0.025"/>
  <circle cx="1080" cy="60" r="180" fill="#80d877" opacity="0.055" filter="url(#glow)"/>
  <circle cx="90" cy="525" r="140" fill="#ffb000" opacity="0.045" filter="url(#glow)"/>

  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="60" y="62" fill="#80d877" font-size="12" font-weight="700" letter-spacing="3">LOCAL-FIRST ARCHITECTURE</text>
    <text x="60" y="105" fill="#f6f7f7" font-size="34" font-weight="600" letter-spacing="-0.8">Everything runs on your machine.</text>
    <text x="60" y="132" fill="#8f999d" font-size="15">One profile. One SQLite file. No account server between you and your repertoire.</text>

    <!-- Client card -->
    <g>
      <rect x="60" y="174" width="320" height="252" rx="14" fill="url(#card)" stroke="#333b3e"/>
      <rect x="60" y="174" width="320" height="3" rx="1.5" fill="url(#green)"/>
      <circle cx="88" cy="206" r="11" fill="#80d877" opacity="0.18"/>
      <circle cx="88" cy="206" r="4" fill="#80d877"/>
      <text x="110" y="211" fill="#f4f6f6" font-size="15" font-weight="600">React PWA</text>
      <text x="86" y="245" fill="#7e8a8e" font-size="11" font-weight="600" letter-spacing="1.3">CLIENT</text>
      <text x="86" y="273" fill="#cbd2d4" font-size="13">React 19 · Vite 8 · TypeScript</text>
      <text x="86" y="300" fill="#97a1a5" font-size="12.5">Repertoire tree · board · drill loop</text>
      <text x="86" y="322" fill="#97a1a5" font-size="12.5">Installable shell · offline cache</text>
      <rect x="86" y="350" width="102" height="26" rx="13" fill="#80d877" opacity="0.12" stroke="#80d877" stroke-opacity="0.32"/>
      <text x="101" y="367" fill="#9fe399" font-size="10.5" font-weight="700" letter-spacing="0.8">PWA READY</text>
      <text x="86" y="402" fill="#6f7a7e" font-size="11">Chrome · Safari · Edge · iOS / Android</text>
    </g>

    <!-- Arrow 1 -->
    <g stroke="#7d8a8e" stroke-width="1.4" fill="none">
      <path d="M382 300 L438 300"/>
      <path d="M430 294 L438 300 L430 306"/>
    </g>
    <text x="410" y="284" text-anchor="middle" fill="#e4e8e8" font-size="9.5" font-weight="600" letter-spacing="0.4">HTTP</text>
    <text x="410" y="322" text-anchor="middle" fill="#6f7a7e" font-size="9">localhost</text>

    <!-- API card -->
    <g>
      <rect x="440" y="174" width="320" height="252" rx="14" fill="url(#card)" stroke="#333b3e"/>
      <rect x="440" y="174" width="320" height="3" rx="1.5" fill="url(#orange)"/>
      <circle cx="468" cy="206" r="11" fill="#ffb000" opacity="0.18"/>
      <circle cx="468" cy="206" r="4" fill="#ffb000"/>
      <text x="490" y="211" fill="#f4f6f6" font-size="15" font-weight="600">Local API</text>
      <text x="466" y="245" fill="#7e8a8e" font-size="11" font-weight="600" letter-spacing="1.3">BRIDGE</text>
      <text x="466" y="273" fill="#cbd2d4" font-size="13">Express 5 · Node 26</text>
      <text x="466" y="300" fill="#97a1a5" font-size="12.5">/me · /repertoires · /practice</text>
      <text x="466" y="322" fill="#97a1a5" font-size="12.5">/settings · /model-games</text>
      <rect x="466" y="350" width="122" height="26" rx="13" fill="#ffb000" opacity="0.11" stroke="#ffb000" stroke-opacity="0.3"/>
      <text x="481" y="367" fill="#ffc861" font-size="10.5" font-weight="700" letter-spacing="0.8">NO AUTH LAYER</text>
      <text x="466" y="402" fill="#6f7a7e" font-size="11">Every request resolves to the local profile</text>
    </g>

    <!-- Arrow 2 -->
    <g stroke="#7d8a8e" stroke-width="1.4" fill="none">
      <path d="M762 300 L818 300"/>
      <path d="M810 294 L818 300 L810 306"/>
    </g>
    <text x="790" y="284" text-anchor="middle" fill="#e4e8e8" font-size="9.5" font-weight="600" letter-spacing="0.3">node:sqlite</text>
    <text x="790" y="322" text-anchor="middle" fill="#6f7a7e" font-size="9">in-process</text>

    <!-- SQLite card -->
    <g>
      <rect x="820" y="174" width="320" height="252" rx="14" fill="url(#card)" stroke="#333b3e"/>
      <rect x="820" y="174" width="320" height="3" rx="1.5" fill="url(#green)"/>
      <circle cx="848" cy="206" r="11" fill="#80d877" opacity="0.18"/>
      <circle cx="848" cy="206" r="4" fill="#80d877"/>
      <text x="870" y="211" fill="#f4f6f6" font-size="15" font-weight="600">SQLite</text>
      <text x="846" y="245" fill="#7e8a8e" font-size="11" font-weight="600" letter-spacing="1.3">STORAGE</text>
      <text x="846" y="273" fill="#cbd2d4" font-size="13">server/data/chessbook.db</text>
      <text x="846" y="300" fill="#97a1a5" font-size="12.5">Profile · lines · attempts · settings</text>
      <text x="846" y="322" fill="#97a1a5" font-size="12.5">3,865 ECO openings · model games</text>
      <rect x="846" y="350" width="108" height="26" rx="13" fill="#80d877" opacity="0.12" stroke="#80d877" stroke-opacity="0.32"/>
      <text x="861" y="367" fill="#9fe399" font-size="10.5" font-weight="700" letter-spacing="0.8">LOCAL ONLY</text>
      <text x="846" y="402" fill="#6f7a7e" font-size="11">Delete the file to start completely fresh</text>
    </g>

    <!-- Footer strip -->
    <g>
      <rect x="60" y="462" width="1080" height="58" rx="12" fill="#1a1f20" stroke="#2c3436"/>
      <text x="84" y="496" fill="#e8ecec" font-size="12.5" font-weight="600">No signup</text>
      <text x="190" y="496" fill="#e8ecec" font-size="12.5" font-weight="600">No cloud sync</text>
      <text x="320" y="496" fill="#e8ecec" font-size="12.5" font-weight="600">No telemetry</text>
      <text x="455" y="496" fill="#e8ecec" font-size="12.5" font-weight="600">No install modal</text>
      <text x="602" y="496" fill="#6f7a7e" font-size="12">— your progress never leaves this device</text>
      <g transform="translate(1010 482)">
        <rect width="18" height="18" rx="4" fill="#80d877" opacity="0.18"/>
        <path d="M4.5 9.5 L8 13 L14 5.5" fill="none" stroke="#80d877" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="1040" y="496" fill="#9fe399" font-size="10.5" font-weight="700" letter-spacing="1">OFFLINE-FIRST</text>
    </g>
  </g>
</svg>
